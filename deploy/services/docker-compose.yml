# Wyvrn's services on a machine that already has a web server in front (Caddy,
# nginx, ...) and a MySQL or MariaDB server: each service listens on this
# machine only, for that web server to pass its domain to, and keeps what it
# keeps -- its own keys among it -- in a database of its own: nothing is left in
# the containers. See README.md beside this file.
#
#   cp .env.example .env    # and fill it in
#   docker compose up -d                                         # the DID host and the sticker service
#   docker compose --profile community --profile announce up -d  # and the two an app isn't built to expect
name: wyvrn-services

x-service: &service
  restart: unless-stopped
  # For a database on this machine itself: `host.docker.internal` in a
  # DATABASE_URL is this machine, as a container sees it.
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  # Public addresses (did:web:<domain>:<name>). The app is built to use
  # did:web:id.wyvrn.app unless told otherwise (VITE_DID_HOST_DID).
  did-host:
    <<: *service
    image: wyvrn-did-host
    build:
      context: ../..
      dockerfile: services/did-host/Dockerfile
    ports:
      - "127.0.0.1:${DID_HOST_PORT:-8181}:8080"
    environment:
      DID_HOST_DOMAIN: "${DID_HOST_DOMAIN:?set DID_HOST_DOMAIN in .env}"
      DID_HOST_PUBLIC_URL: "https://${DID_HOST_DOMAIN}/"
      DID_HOST_DID_METHOD: "web"
      DID_HOST_ADMINS: "${DID_HOST_ADMINS:-}"
      DID_HOST_DATABASE_URL: "${DID_HOST_DATABASE_URL:?set DID_HOST_DATABASE_URL in .env}"
      # Who it says it is, to someone looking its DID up (../../README.md).
      DID_HOST_PROFILE_NAME: "${DID_HOST_PROFILE_NAME:-}"
      DID_HOST_PROFILE_DESCRIPTION: "${DID_HOST_PROFILE_DESCRIPTION:-}"

  # Sticker and custom-emoji packs. The app is built to use
  # did:web:stickers.wyvrn.app unless told otherwise (VITE_STICKER_SERVICE_DID).
  stickers:
    <<: *service
    image: wyvrn-stickers
    build:
      context: ../..
      dockerfile: services/stickers/Dockerfile
    ports:
      - "127.0.0.1:${STICKERS_PORT:-8182}:8080"
    environment:
      STICKERS_PUBLIC_URL: "https://${STICKERS_DOMAIN:?set STICKERS_DOMAIN in .env}/"
      STICKERS_DID_METHOD: "web"
      STICKERS_ADMINS: "${STICKERS_ADMINS:-}"
      STICKERS_DATABASE_URL: "${STICKERS_DATABASE_URL:?set STICKERS_DATABASE_URL in .env}"
      # Who it says it is, to someone looking its DID up (../../README.md).
      STICKERS_PUBLIC_ADDRESS: "${STICKERS_PUBLIC_ADDRESS:-}"
      STICKERS_PROFILE_NAME: "${STICKERS_PROFILE_NAME:-}"
      STICKERS_PROFILE_DESCRIPTION: "${STICKERS_PROFILE_DESCRIPTION:-}"

  # A community server. No app is built to expect one: people are given its DID.
  community:
    <<: *service
    profiles: ["community"]
    image: wyvrn-community
    build:
      context: ../..
      dockerfile: services/community/Dockerfile
    ports:
      - "127.0.0.1:${COMMUNITY_PORT:-8183}:8080"
    environment:
      COMMUNITY_PUBLIC_URL: "https://${COMMUNITY_DOMAIN:?set COMMUNITY_DOMAIN in .env}/"
      COMMUNITY_DID_METHOD: "web"
      COMMUNITY_NAME: "${COMMUNITY_NAME:-A community}"
      COMMUNITY_ADMINS: "${COMMUNITY_ADMINS:-}"
      COMMUNITY_MEMBERS: "${COMMUNITY_MEMBERS:-}"
      COMMUNITY_DATABASE_URL: "${COMMUNITY_DATABASE_URL:?set COMMUNITY_DATABASE_URL in .env}"
      # Who it says it is, to someone looking its DID up (../../README.md).
      COMMUNITY_PUBLIC_ADDRESS: "${COMMUNITY_PUBLIC_ADDRESS:-}"
      COMMUNITY_PROFILE_NAME: "${COMMUNITY_PROFILE_NAME:-}"
      COMMUNITY_PROFILE_DESCRIPTION: "${COMMUNITY_PROFILE_DESCRIPTION:-}"

  # An announcement channel. Likewise: people are given its DID.
  announce:
    <<: *service
    profiles: ["announce"]
    image: wyvrn-announce
    build:
      context: ../..
      dockerfile: services/announce/Dockerfile
    ports:
      - "127.0.0.1:${ANNOUNCE_PORT:-8184}:8080"
    environment:
      ANNOUNCE_PUBLIC_URL: "https://${ANNOUNCE_DOMAIN:?set ANNOUNCE_DOMAIN in .env}/"
      ANNOUNCE_DID_METHOD: "web"
      ANNOUNCE_NAME: "${ANNOUNCE_NAME:-Announcements}"
      ANNOUNCE_DESCRIPTION: "${ANNOUNCE_DESCRIPTION:-A one-way announcement channel.}"
      ANNOUNCE_ADMINS: "${ANNOUNCE_ADMINS:-}"
      ANNOUNCE_DATABASE_URL: "${ANNOUNCE_DATABASE_URL:?set ANNOUNCE_DATABASE_URL in .env}"
      # Who it says it is, to someone looking its DID up (../../README.md).
      ANNOUNCE_PUBLIC_ADDRESS: "${ANNOUNCE_PUBLIC_ADDRESS:-}"
      ANNOUNCE_PROFILE_NAME: "${ANNOUNCE_PROFILE_NAME:-}"
      ANNOUNCE_PROFILE_DESCRIPTION: "${ANNOUNCE_PROFILE_DESCRIPTION:-}"

  # Files too big for a message, for the agents FILES_UPLOADERS names. No app is
  # built to expect one: an uploader is given its DID. The bytes live in a
  # volume on this machine (files-data); its records are in its database.
  files:
    <<: *service
    profiles: ["files"]
    image: wyvrn-files
    build:
      context: ../..
      dockerfile: services/files/Dockerfile
    ports:
      - "127.0.0.1:${FILES_PORT:-8186}:8080"
    environment:
      FILES_PUBLIC_URL: "https://${FILES_DOMAIN:?set FILES_DOMAIN in .env}/"
      FILES_DID_METHOD: "web"
      FILES_UPLOADERS: "${FILES_UPLOADERS:-}"
      FILES_QUOTA_BYTES: "${FILES_QUOTA_BYTES:-10737418240}"
      FILES_DATABASE_URL: "${FILES_DATABASE_URL:?set FILES_DATABASE_URL in .env}"
      # Who it says it is, to someone looking its DID up (../../README.md).
      FILES_PUBLIC_ADDRESS: "${FILES_PUBLIC_ADDRESS:-}"
      FILES_PROFILE_NAME: "${FILES_PROFILE_NAME:-}"
      FILES_PROFILE_DESCRIPTION: "${FILES_PROFILE_DESCRIPTION:-}"
    volumes:
      - files-data:/app/data

  # Link cards: what a link to an address or an invite looks like where it is
  # posted. In front of the web app's own /dl pages, for what fetches a link to
  # show it (Caddyfile.example). It keeps nothing and needs no database.
  cards:
    <<: *service
    profiles: ["cards"]
    image: wyvrn-cards
    build:
      context: ../..
      dockerfile: services/cards/Dockerfile
    ports:
      - "127.0.0.1:${CARDS_PORT:-8185}:8080"
    environment:
      # The DID host whose "official:" names are marked official, and the domains
      # whose own did:web is: what the app is built with (VITE_OFFICIAL_DOMAINS).
      CARDS_DID_HOST: "${DID_HOST_DOMAIN:-id.wyvrn.app}"
      CARDS_OFFICIAL_DOMAINS: "${CARDS_OFFICIAL_DOMAINS:-}"
      CARDS_SITE_NAME: "${CARDS_SITE_NAME:-Wyvrn}"
      # Where the links point, if the proxy in front doesn't say rightly
      # (X-Forwarded-Proto, Host): a page naming its picture at http:// gets none.
      CARDS_PUBLIC_URL: "${CARDS_PUBLIC_URL:-}"

volumes:
  # Every file the files service holds. The only thing this stack keeps outside
  # the databases: `docker volume inspect wyvrn-services_files-data` says where.
  files-data:
