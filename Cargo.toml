# Wyvrn's services, in one workspace so that they share crates: what every
# DIDComm service has to do (an identity and an address, a mediator to be reached
# through, an endpoint that receives and answers) lives in `crates/`, and each
# service in `services/` is what is particular to it.
[workspace]
resolver = "2"
members = ["crates/*", "services/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/wyvrn-cloud/services"
publish = false

# One version of each dependency for every member: a member says
# `name = { workspace = true }` (adding features of its own where it needs them).
[workspace.dependencies]
wyvrn-service = { path = "crates/wyvrn-service" }
wyvrn-hosted-did = { path = "crates/wyvrn-hosted-did" }

# Tracks didcomm's default branch; pin a tag (tag = "...") once it publishes releases.
didcomm-agent = { git = "https://github.com/wyvrn-cloud/didcomm" }
didcomm-core = { git = "https://github.com/wyvrn-cloud/didcomm" }
didcomm-crypto-askar = { git = "https://github.com/wyvrn-cloud/didcomm" }
didcomm-quickstart = { git = "https://github.com/wyvrn-cloud/didcomm" }
didcomm-resolver-peer = { git = "https://github.com/wyvrn-cloud/didcomm" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
reqwest = "0.13"
rusqlite = { version = "0.37", features = ["bundled"] }
# A service's store in MySQL or MariaDB instead (crates/wyvrn-service's `db`).
# Without the C zlib, and with the TLS the rest of the workspace already builds.
mysql = { version = "28", default-features = false, features = ["minimal-rust", "buffer-pool", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

# did:webvh logs: checked with the same crate the DIDComm library resolves them
# with. Without its own network code: a host is handed logs, it doesn't fetch them.
didwebvh-rs = { version = "0.7", default-features = false }
# Signed presentations (a hosted DID's whois).
affinidi-data-integrity = "0.7"
affinidi-secrets-resolver = "0.5"
bs58 = "0.5"
ed25519-dalek = "2"
sha2 = "0.10"
# Dates in credentials, compared. No clock: the caller says what time it is.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
