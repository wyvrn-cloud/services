# Every service in this repository, each to be started by name:
# `docker compose up announce`. Each is built from this directory, the workspace
# its crate is a member of.
services:
  # An announcement channel (services/announce). As it stands: at
  # http://localhost:8080/ as a did:peer:4, which is enough to try it with a local
  # Wyvrn. For a real one, put it behind HTTPS and set the two commented lines (see
  # services/announce/README.md).
  announce:
    build:
      context: .
      dockerfile: services/announce/Dockerfile
    ports:
      - "${ANNOUNCE_PORT:-8080}:8080"
    environment:
      ANNOUNCE_PUBLIC_URL: "${ANNOUNCE_PUBLIC_URL:-http://localhost:8080/}"
      ANNOUNCE_DID_METHOD: "${ANNOUNCE_DID_METHOD:-peer}"
      # ANNOUNCE_PUBLIC_URL: "https://updates.example/"
      # ANNOUNCE_DID_METHOD: "web"
      ANNOUNCE_NAME: "${ANNOUNCE_NAME:-Announcements}"
      ANNOUNCE_DESCRIPTION: "${ANNOUNCE_DESCRIPTION:-A one-way announcement channel.}"
      # The DIDs that may post, separated by commas. Only needed for the first admin.
      ANNOUNCE_ADMINS: "${ANNOUNCE_ADMINS:-}"
      # In MySQL or MariaDB instead of the volume, its keys too: mysql://user:password@host/database,
      # a database of this service's own (README.md).
      ANNOUNCE_DATABASE_URL: "${ANNOUNCE_DATABASE_URL:-}"
    volumes:
      - announce-data:/app/data
    restart: unless-stopped

  # A DID host (services/did-host): short, stable did:webvh DIDs for agents that
  # write and sign them themselves. It has to be at a real domain over HTTPS to be
  # of use: the DIDs it hosts are fetched from https://<DID_HOST_DOMAIN>/<name>/did.jsonl.
  # As it stands it runs, and can be written to, but nothing it hosts resolves.
  # For one at a real domain, with HTTPS: deploy/did-host.
  did-host:
    build:
      context: .
      dockerfile: services/did-host/Dockerfile
    ports:
      - "${DID_HOST_PORT:-8081}:8080"
    environment:
      DID_HOST_PUBLIC_URL: "${DID_HOST_PUBLIC_URL:-http://localhost:8081/}"
      DID_HOST_DID_METHOD: "${DID_HOST_DID_METHOD:-peer}"
      DID_HOST_DOMAIN: "${DID_HOST_DOMAIN:-id.localhost.example}"
      # DID_HOST_PUBLIC_URL: "https://id.example/"
      # DID_HOST_DID_METHOD: "web"
      # DID_HOST_DOMAIN: "id.example"
      # The DIDs that decide who may claim a reserved name, separated by commas.
      DID_HOST_ADMINS: "${DID_HOST_ADMINS:-}"
      # In MySQL or MariaDB instead of the volume, its keys too: mysql://user:password@host/database,
      # a database of this service's own (README.md).
      DID_HOST_DATABASE_URL: "${DID_HOST_DATABASE_URL:-}"
    volumes:
      - did-host-data:/app/data
    restart: unless-stopped

  # A sticker service (services/stickers): hosts sticker and custom-emoji packs,
  # made by talking to it and fetched from it over HTTP. As it stands: at
  # http://localhost:8082/, which is enough to try it with a local Wyvrn. A pack's
  # address starts with STICKERS_PUBLIC_URL, so a real one needs its real address
  # there, over HTTPS (see services/stickers/README.md).
  stickers:
    build:
      context: .
      dockerfile: services/stickers/Dockerfile
    ports:
      - "${STICKERS_PORT:-8082}:8080"
    environment:
      STICKERS_PUBLIC_URL: "${STICKERS_PUBLIC_URL:-http://localhost:8082/}"
      STICKERS_DID_METHOD: "${STICKERS_DID_METHOD:-peer}"
      # STICKERS_PUBLIC_URL: "https://stickers.example/"
      # STICKERS_DID_METHOD: "web"
      # The DIDs that may take a pack down, separated by commas.
      STICKERS_ADMINS: "${STICKERS_ADMINS:-}"
      # In MySQL or MariaDB instead of the volume, its keys too: mysql://user:password@host/database,
      # a database of this service's own (README.md).
      STICKERS_DATABASE_URL: "${STICKERS_DATABASE_URL:-}"
    volumes:
      - stickers-data:/app/data
    restart: unless-stopped

  # Link cards (services/cards): what a link to an address or an invite looks
  # like where it is posted. Try http://localhost:8085/dl/did:web:id.wyvrn.app:<name>.
  cards:
    build:
      context: .
      dockerfile: services/cards/Dockerfile
    ports:
      - "${CARDS_PORT:-8085}:8080"
    environment:
      CARDS_DID_HOST: "${CARDS_DID_HOST:-id.wyvrn.app}"
      CARDS_OFFICIAL_DOMAINS: "${CARDS_OFFICIAL_DOMAINS:-}"
      CARDS_SITE_NAME: "${CARDS_SITE_NAME:-Wyvrn}"
    restart: unless-stopped

  # A files service (services/files): files too big for a message, put there by
  # the agents FILES_UPLOADERS names and fetched from it by anyone with the link.
  # A file's address starts with FILES_PUBLIC_URL, so a real one needs its real
  # address there, over HTTPS (see services/files/README.md).
  files:
    build:
      context: .
      dockerfile: services/files/Dockerfile
    ports:
      - "${FILES_PORT:-8086}:8080"
    environment:
      FILES_PUBLIC_URL: "${FILES_PUBLIC_URL:-http://localhost:8086/}"
      FILES_DID_METHOD: "${FILES_DID_METHOD:-peer}"
      # FILES_PUBLIC_URL: "https://files.example/"
      # FILES_DID_METHOD: "web"
      # Who may put files here, separated by commas: nobody until someone is named.
      FILES_UPLOADERS: "${FILES_UPLOADERS:-}"
      # Who runs it (its admin pages are theirs), and whether anyone may sign up.
      FILES_ADMINS: "${FILES_ADMINS:-}"
      FILES_OPEN_SIGNUP: "${FILES_OPEN_SIGNUP:-false}"
      # Its records in MySQL or MariaDB instead of the volume, its keys too:
      # mysql://user:password@host/database, a database of this service's own (README.md).
      # The bytes stay in the volume either way.
      FILES_DATABASE_URL: "${FILES_DATABASE_URL:-}"
    volumes:
      - files-data:/app/data
    restart: unless-stopped

  # A community server (services/community): channels that the people let in, and
  # nobody else, read and post in. Nobody is let in until COMMUNITY_ADMINS names
  # someone (the ID their app shows for them), or one is added from here:
  #   docker compose exec community wyvrn-community add <did> admin
  community:
    build:
      context: .
      dockerfile: services/community/Dockerfile
    ports:
      - "${COMMUNITY_PORT:-8083}:8080"
    environment:
      COMMUNITY_PUBLIC_URL: "${COMMUNITY_PUBLIC_URL:-http://localhost:8083/}"
      COMMUNITY_DID_METHOD: "${COMMUNITY_DID_METHOD:-peer}"
      # COMMUNITY_PUBLIC_URL: "https://community.example/"
      # COMMUNITY_DID_METHOD: "web"
      COMMUNITY_NAME: "${COMMUNITY_NAME:-A community}"
      # DIDs, separated by commas.
      COMMUNITY_ADMINS: "${COMMUNITY_ADMINS:-}"
      COMMUNITY_MEMBERS: "${COMMUNITY_MEMBERS:-}"
      # In MySQL or MariaDB instead of the volume, its keys too: mysql://user:password@host/database,
      # a database of this service's own (README.md).
      COMMUNITY_DATABASE_URL: "${COMMUNITY_DATABASE_URL:-}"
      # Voice channels: the relay members' apps connect to (community-voice below),
      # and the SHA-256 of its certificate while it is self-signed. Empty: no voice.
      COMMUNITY_VOICE_RELAY_URL: "${COMMUNITY_VOICE_RELAY_URL:-}"
      COMMUNITY_VOICE_RELAY_FINGERPRINT: "${COMMUNITY_VOICE_RELAY_FINGERPRINT:-}"
    volumes:
      - community-data:/app/data
    restart: unless-stopped

  # The community's voice relay (moq-relay): forwards voice channels' media, which
  # it can't read, and asks the community who may do what. Started with
  #   docker compose --profile voice up -d
  # Point COMMUNITY_VOICE_RELAY_URL at it (https://<host>:4443/). A community may
  # instead use a separate one (the official community does): any moq-relay whose
  # [auth] url is this community's <public_url>/voice/auth.
  community-voice:
    image: "moqdev/moq-relay:${MOQ_RELAY_TAG:-latest}"
    profiles: ["voice"]
    command: ["/app/relay.toml"]
    ports:
      - "${COMMUNITY_VOICE_PORT:-4443}:4443/udp"
      - "${COMMUNITY_VOICE_PORT:-4443}:4443/tcp"
    volumes:
      - ./deploy/voice/moq-relay.toml:/app/relay.toml:ro
    depends_on:
      - community
    restart: unless-stopped

  # An outbound relay (services/relay): agents registered with it send through it,
  # over a WebSocket, so that where their messages go sees the relay and not them.
  # RELAY_CARRIES is "sends" (their messages to others) or "all" (their own
  # mediator's traffic too). It reaches nothing on a private network unless
  # RELAY_ALLOW names it: a mediator beside it, say.
  relay:
    build:
      context: .
      dockerfile: services/relay/Dockerfile
    ports:
      - "${RELAY_PORT:-8087}:8080"
    environment:
      RELAY_PUBLIC_URL: "${RELAY_PUBLIC_URL:-http://localhost:8087/}"
      RELAY_DID_METHOD: "${RELAY_DID_METHOD:-peer}"
      # RELAY_PUBLIC_URL: "https://relay.example/"
      # RELAY_DID_METHOD: "web"
      RELAY_CARRIES: "${RELAY_CARRIES:-all}"
      # Whether anyone may register, or only the DIDs in RELAY_CLIENTS (commas).
      RELAY_OPEN: "${RELAY_OPEN:-true}"
      RELAY_CLIENTS: "${RELAY_CLIENTS:-}"
      # Hosts it may reach although they are private, separated by commas.
      RELAY_ALLOW: "${RELAY_ALLOW:-}"
      RELAY_DATABASE_URL: "${RELAY_DATABASE_URL:-}"
    volumes:
      - relay-data:/app/data
    restart: unless-stopped

volumes:
  files-data:
  community-data:
  stickers-data:
  did-host-data:
  announce-data:
  relay-data:
