# Every service in this repository, each to be started by name:
# `docker compose up announce`. Each is built from this directory, the workspace
# its crate is a member of.
services:
  # An announcement channel (services/announce). As it stands: at
  # http://localhost:8080/ as a did:peer:4, which is enough to try it with a local
  # Wyvrn. For a real one, put it behind HTTPS and set the two commented lines (see
  # services/announce/README.md).
  announce:
    build:
      context: .
      dockerfile: services/announce/Dockerfile
    ports:
      - "${ANNOUNCE_PORT:-8080}:8080"
    environment:
      ANNOUNCE_PUBLIC_URL: "${ANNOUNCE_PUBLIC_URL:-http://localhost:8080/}"
      ANNOUNCE_DID_METHOD: "${ANNOUNCE_DID_METHOD:-peer}"
      # ANNOUNCE_PUBLIC_URL: "https://updates.example/"
      # ANNOUNCE_DID_METHOD: "web"
      ANNOUNCE_NAME: "${ANNOUNCE_NAME:-Announcements}"
      ANNOUNCE_DESCRIPTION: "${ANNOUNCE_DESCRIPTION:-A one-way announcement channel.}"
      # The DIDs that may post, separated by commas. Only needed for the first admin.
      ANNOUNCE_ADMINS: "${ANNOUNCE_ADMINS:-}"
    volumes:
      - announce-data:/app/data
    restart: unless-stopped

  # A DID host (services/did-host): short, stable did:webvh DIDs for agents that
  # write and sign them themselves. It has to be at a real domain over HTTPS to be
  # of use: the DIDs it hosts are fetched from https://<DID_HOST_DOMAIN>/<name>/did.jsonl.
  # As it stands it runs, and can be written to, but nothing it hosts resolves.
  # For one at a real domain, with HTTPS: deploy/did-host.
  did-host:
    build:
      context: .
      dockerfile: services/did-host/Dockerfile
    ports:
      - "${DID_HOST_PORT:-8081}:8080"
    environment:
      DID_HOST_PUBLIC_URL: "${DID_HOST_PUBLIC_URL:-http://localhost:8081/}"
      DID_HOST_DID_METHOD: "${DID_HOST_DID_METHOD:-peer}"
      DID_HOST_DOMAIN: "${DID_HOST_DOMAIN:-id.localhost.example}"
      # DID_HOST_PUBLIC_URL: "https://id.example/"
      # DID_HOST_DID_METHOD: "web"
      # DID_HOST_DOMAIN: "id.example"
      # The DIDs that decide who may claim a reserved name, separated by commas.
      DID_HOST_ADMINS: "${DID_HOST_ADMINS:-}"
    volumes:
      - did-host-data:/app/data
    restart: unless-stopped

  # A sticker service (services/stickers): hosts sticker and custom-emoji packs,
  # made by talking to it and fetched from it over HTTP. As it stands: at
  # http://localhost:8082/, which is enough to try it with a local Wyvrn. A pack's
  # address starts with STICKERS_PUBLIC_URL, so a real one needs its real address
  # there, over HTTPS (see services/stickers/README.md).
  stickers:
    build:
      context: .
      dockerfile: services/stickers/Dockerfile
    ports:
      - "${STICKERS_PORT:-8082}:8080"
    environment:
      STICKERS_PUBLIC_URL: "${STICKERS_PUBLIC_URL:-http://localhost:8082/}"
      STICKERS_DID_METHOD: "${STICKERS_DID_METHOD:-peer}"
      # STICKERS_PUBLIC_URL: "https://stickers.example/"
      # STICKERS_DID_METHOD: "web"
      # The DIDs that may take a pack down, separated by commas.
      STICKERS_ADMINS: "${STICKERS_ADMINS:-}"
    volumes:
      - stickers-data:/app/data
    restart: unless-stopped

  # A community server (services/community): channels that the people let in, and
  # nobody else, read and post in. Nobody is let in until COMMUNITY_ADMINS names
  # someone (the ID their app shows for them), or one is added from here:
  #   docker compose exec community wyvrn-community add <did> admin
  community:
    build:
      context: .
      dockerfile: services/community/Dockerfile
    ports:
      - "${COMMUNITY_PORT:-8083}:8080"
    environment:
      COMMUNITY_PUBLIC_URL: "${COMMUNITY_PUBLIC_URL:-http://localhost:8083/}"
      COMMUNITY_DID_METHOD: "${COMMUNITY_DID_METHOD:-peer}"
      # COMMUNITY_PUBLIC_URL: "https://community.example/"
      # COMMUNITY_DID_METHOD: "web"
      COMMUNITY_NAME: "${COMMUNITY_NAME:-A community}"
      # DIDs, separated by commas.
      COMMUNITY_ADMINS: "${COMMUNITY_ADMINS:-}"
      COMMUNITY_MEMBERS: "${COMMUNITY_MEMBERS:-}"
    volumes:
      - community-data:/app/data
    restart: unless-stopped

volumes:
  community-data:
  stickers-data:
  did-host-data:
  announce-data:
