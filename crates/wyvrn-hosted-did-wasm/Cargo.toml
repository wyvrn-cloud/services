[package]
name = "wyvrn-hosted-did-wasm"
description = "wyvrn-hosted-did for a web app: its text-in, text-out functions as a WebAssembly module"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wyvrn-hosted-did = { workspace = true }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# A browser has no OS randomness for these to find by themselves; each needs
# telling to ask JavaScript. Nothing here makes a key (keys come in from the app),
# but the signing and hashing crates underneath pull in a random source, and the
# build fails outright on wasm32 without this.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
