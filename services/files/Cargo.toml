[package]
name = "wyvrn-files"
description = "A files service: stores files too big for a message, put there over HTTPS in resumable chunks by agents it allows (files/1.0), and serves them to anyone with the link"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
wyvrn-service = { workspace = true }
didcomm-agent = { workspace = true }
didcomm-core = { workspace = true }
didcomm-crypto-askar = { workspace = true }
didcomm-quickstart = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bs58 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
toml = { workspace = true }
# `fs`: serving a stored file with Range requests (tower_http::services::ServeFile).
tower-http = { workspace = true, features = ["fs"] }
tracing = { workspace = true }
uuid = { workspace = true }
# Files kept in an S3-compatible bucket (bucket.rs): rusty-s3 signs, reqwest sends.
rusty-s3 = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
futures-util = "0.3"
url = "2"

[dev-dependencies]
