[package]
name = "wyvrn-files"
description = "A files service: stores files too big for a message, put there over HTTPS in resumable chunks by agents it allows (files/1.0), and serves them to anyone with the link"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
wyvrn-service = { workspace = true }
didcomm-agent = { workspace = true }
didcomm-core = { workspace = true }
didcomm-crypto-askar = { workspace = true }
didcomm-quickstart = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bs58 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
# `fs`: serving a stored file with Range requests (tower_http::services::ServeFile).
tower-http = { workspace = true, features = ["fs"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
