[package]
name = "wyvrn-announce"
description = "A one-way announcement channel over DIDComm: people subscribe, admins post, everyone subscribed receives it, and a web page shows every post"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
wyvrn-service = { workspace = true }
didcomm-agent = { workspace = true }
didcomm-core = { workspace = true }
didcomm-crypto-askar = { workspace = true }
didcomm-quickstart = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The tests post to the channel as an app would.
reqwest = { workspace = true }
