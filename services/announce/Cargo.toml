[package]
name = "wyvrn-announce"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "A one-way announcement channel over DIDComm: people subscribe, admins post, everyone subscribed receives it, and a web page shows every post"
publish = false

[dependencies]
# Tracks didcomm's default branch; pin a tag (tag = "...") once it publishes releases.
didcomm-agent = { git = "https://github.com/wyvrn-cloud/didcomm" }
didcomm-core = { git = "https://github.com/wyvrn-cloud/didcomm" }
didcomm-crypto-askar = { git = "https://github.com/wyvrn-cloud/didcomm" }
didcomm-quickstart = { git = "https://github.com/wyvrn-cloud/didcomm" }
anyhow = "1"
axum = "0.8"
base64 = "0.22"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
reqwest = "0.13"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
