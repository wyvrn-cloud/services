[package]
name = "wyvrn-community"
description = "A community server over DIDComm: channels that its members, and nobody else, read and post in (community/1.0), with questions answered as workflow/1.0 forms"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The assistant asks Anthropic's Messages API (assistant.rs).
reqwest = { workspace = true, features = ["json"] }
wyvrn-service = { workspace = true }
# Files members attach, kept here (files/1.0's host, at the community's own DID).
wyvrn-files = { path = "../files" }
# The community's own sticker and emoji packs (stickers/1.0's service, at its DID).
wyvrn-stickers = { path = "../stickers" }
didcomm-agent = { workspace = true }
didcomm-core = { workspace = true }
didcomm-crypto-askar = { workspace = true }
didcomm-quickstart = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true, features = ["ws"] }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true, features = ["fs"] }
tracing = { workspace = true }
uuid = { workspace = true }
# Unicode categories, for what a text channel may be called (community.rs).
regex = "1"
sha2 = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
reqwest-websocket = "0.6"
# The tests talk to the server as members' apps would.
reqwest = { workspace = true }
