[package]
name = "wyvrn-community"
description = "A community server over DIDComm: channels that its members, and nobody else, read and post in (community/1.0), with questions answered as workflow/1.0 forms"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The community's picture made small enough, and of a kind, for Discord's webhook
# avatar (announcements.rs): read whatever it is, written as PNG or JPEG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# The assistant asks Anthropic's Messages API (assistant.rs).
reqwest = { workspace = true, features = ["json", "multipart"] }
wyvrn-service = { workspace = true }
# Files members attach, kept here (files/1.0's host, at the community's own DID).
wyvrn-files = { path = "../files" }
# The community's own sticker and emoji packs (stickers/1.0's service, at its DID).
wyvrn-stickers = { path = "../stickers" }
didcomm-agent = { workspace = true }
didcomm-core = { workspace = true }
didcomm-crypto-askar = { workspace = true }
didcomm-quickstart = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true, features = ["ws", "multipart"] }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true, features = ["fs"] }
tracing = { workspace = true }
uuid = { workspace = true }
# Unicode categories, for what a text channel may be called (community.rs).
regex = "1"
# AutoMod's filters (automod.rs): profanity, slurs, sexual words and insults by
# how bad they are, found however they are disguised (l33t, s p a c e d, ѕwapped
# letters), and censored.
rustrict = { version = "0.7.39", default-features = false, features = ["censor"] }
sha2 = { workspace = true }
base64 = { workspace = true }
# The web view (web/): its pages, compiled from templates/ and escaped as they are
# written; posts' Markdown, as announcement channels render it.
askama = "0.14"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
url = "2"
# Signing the events sent out (outgoing.rs): the version the lock file has.
hmac = "0.12"
# And what announcement channels send other services, with the community's own key.
ed25519-dalek = { workspace = true }
# Events that repeat in their own time zone, across changes of clocks (events.rs).
chrono-tz = "0.10"
# Wiki pages edited together: Yjs documents, kept and merged here (wiki.rs).
yrs = "0.28"
# A wiki page's blame: its versions' lines diffed as git does (Myers).
similar = "2"
# Signing in to the web view (website-sign-in/1.0), and the identity provider's
# ES256 id tokens (community-sign-in/1.0).
wyvrn-sign-in = { path = "../../../wyvrn-sign-in" }
# The checks' lookups (DIDs resolved over HTTPS), and dates on the pages.
wyvrn-hosted-did = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
# The files a public post carries, opened with the key the post carries.
aes-gcm = "0.10"

[dev-dependencies]
# A member speaking as a did:webvh at localhost (tests/community.rs).
didcomm-resolver-webvh = { workspace = true }
# Linked-account credentials signed in claims.rs' tests.
affinidi-data-integrity = { workspace = true }
mysql = { workspace = true }
reqwest-websocket = "0.6"
# The tests talk to the server as members' apps would, and as browsers and
# websites do to its web view.
reqwest = { workspace = true, features = ["form", "multipart"] }
