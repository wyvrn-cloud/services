[package]
name = "wyvrn-community-host"
description = "Many community servers in one process: each its own DID, keys and store (a SQLite folder, a MySQL database, or tables of its own in a shared one), loaded when spoken to"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Each community is wyvrn-community's, opened from settings the host makes.
wyvrn-community = { path = "../community" }
wyvrn-service = { workspace = true }
didcomm-agent = { workspace = true }
didcomm-core = { workspace = true }
didcomm-quickstart = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true, features = ["ws"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
# A community's router is handed each request meant for it (tenants.rs).
tower = { version = "0.5", features = ["util"] }
tower-http = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
