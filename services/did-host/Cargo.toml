# and one made up to list a key that isn't its own.
didcomm-resolver-peer = { workspace = true }
affinidi-data-integrity = { workspace = true }
ed25519-dalek = { workspace = true }
# The tests write real did:webvh logs, as a holder would.
affinidi-secrets-resolver = { workspace = true }
